<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body {
            background: linear-gradient(to bottom right, #0033cc, #001f66);
            color: white;
            font-family: serif;
        }
    </style>
</head>
<body>

<h1>Admin Panel</h1>

<h2>Total Messages: {{ total }}</h2>
<h2>Online Users: {{ online }}</h2>

<h2>Banned Users:</h2>
<ul>
    {% for user in banned %}
        <li>{{ user }}</li>
    {% endfor %}
</ul>

<a href="/chat" style="color:yellow;">Back to Chat</a>

</body>
</html>
